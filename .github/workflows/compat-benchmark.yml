name: Benchmark / Compat

on:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Setup Benchmark Scripts
        run: npm run benchmark:setup

      - name: Start Worker
        run: npm run dev &
        env:
          WRANGLER_LOG: none

      - name: Wait for Worker
        run: npx wait-on -t 60000 http://localhost:8787/api

      - name: Run Tests
        run: npm test

      - name: Run Benchmark Compatibility
        run: npm run benchmark:compat

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-logs
          path: |
            *.log
            benchmarks/results/
