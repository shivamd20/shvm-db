<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Interactive playground for shvm-db - Test DynamoDB operations in real-time with network inspection and request history.">
    <meta name="keywords" content="shvm-db, playground, DynamoDB, API testing, interactive">
    <title>Playground - shvm-db</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;800&family=Fira+Code&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="container">
        <header>
            <a href="/" class="logo">shvm-db</a>
            <span class="experiment-label">Experiment</span>
            <button class="nav-toggle" aria-label="Open menu" type="button"></button>
            <nav class="links">
                <a href="/benchmark-logs.html">Benchmarks</a>
                <a href="/playground.html" class="active">Playground</a>
                <a href="/trace.html">Trace</a>
                <a href="https://github.com/shivamd20/shvm-db" target="_blank" rel="noopener" class="github-link">GitHub</a>
            </nav>
        </header>

        <div class="ide-container">
            <div class="ide-main">
                <!-- Left Panel: Request Builder -->
                <div class="ide-panel left">
                    <div class="ide-tabs">
                        <button class="ide-tab active" data-tab="request">Request</button>
                        <button class="ide-tab" data-tab="history">History</button>
                    </div>

                    <div class="ide-content" id="request-panel">
                        <div class="form-group">
                            <label for="operation">Operation</label>
                            <select id="operation" class="form-control">
                                <option value="PutItem">PutItem</option>
                                <option value="GetItem">GetItem</option>
                                <option value="UpdateItem">UpdateItem</option>
                                <option value="DeleteItem">DeleteItem</option>
                                <option value="CreateTable">CreateTable</option>
                                <option value="DeleteTable">DeleteTable</option>
                                <option value="ListTables">ListTables</option>
                            </select>
                        </div>

                        <div class="form-group" id="table-group">
                            <label for="table-name">Table Name</label>
                            <div style="display: flex; gap: 8px;">
                                <input type="text" id="table-name" class="form-control" value="usertable"
                                    list="table-list">
                                <datalist id="table-list"></datalist>
                                <button id="refresh-tables-btn" class="btn-secondary"
                                    title="Refresh Table List">↻</button>
                            </div>
                        </div>


                        <div class="form-group" id="key-group">
                            <label for="pk">Partition Key (PK) & Sort Key (SK)</label>
                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                                <input type="text" id="pk" class="form-control" placeholder="PK Value (e.g. user_123)">
                                <input type="text" id="sk" class="form-control" placeholder="SK Value (e.g. profile)">
                            </div>
                        </div>


                        <div class="form-group" id="value-group">
                            <label for="value">Value (JSON) <span id="value-hint" style="font-weight: normal; color: #888; font-size: 0.8rem; margin-left: 8px;"></span></label>
                            <textarea id="value" class="form-control" rows="8"
                                placeholder='{\n  "name": "Alice",\n  "role": "admin"\n}'></textarea>
                        </div>

                        <div class="advanced-toggle" style="margin: 15px 0; cursor: pointer; color: #a5d6ff; font-size: 0.9rem;" onclick="document.getElementById('advanced-params').style.display = document.getElementById('advanced-params').style.display === 'none' ? 'block' : 'none'">
                            ► Advanced Parameters (Conditions, Updates)
                        </div>
                        <div id="advanced-params" style="display: none; padding-left: 10px; border-left: 2px solid #333; margin-bottom: 20px;">
                            <div class="form-group">
                                <label for="condition-expression">ConditionExpression</label>
                                <input type="text" id="condition-expression" class="form-control" placeholder="e.g. attribute_not_exists(PK)">
                            </div>
                            <div class="form-group" id="update-group" style="display: none;">
                                <label for="update-expression">UpdateExpression</label>
                                <input type="text" id="update-expression" class="form-control" placeholder="e.g. SET #role = :r">
                            </div>
                            <div class="form-group">
                                <label for="expr-names">ExpressionAttributeNames (JSON)</label>
                                <textarea id="expr-names" class="form-control" rows="2" placeholder='{"#role": "role"}'></textarea>
                            </div>
                            <div class="form-group">
                                <label for="expr-values">ExpressionAttributeValues (JSON)</label>
                                <textarea id="expr-values" class="form-control" rows="2" placeholder='{":r": {"S": "admin"}}'></textarea>
                            </div>
                        </div>

                        <div style="display: flex; gap: 10px;">
                            <button id="run-btn" class="btn-run" style="flex: 1;">
                                <span id="run-text">▶ Execute</span>
                            </button>
                            <button id="snippet-btn" class="btn-secondary" style="white-space: nowrap;" title="Copy as cURL">
                                📋 cURL
                            </button>
                        </div>
                    </div>

                    <div class="ide-content" id="history-panel" style="display: none; padding: 0;">
                        <ul class="history-list" id="history-list">
                            <li style="padding: 20px; text-align: center; color: #666;">No history yet</li>
                        </ul>
                    </div>
                </div>

                <!-- Right Panel: Response & Network -->
                <div class="ide-panel right">
                    <div class="ide-tabs">
                        <button class="ide-tab active" data-tab="response">Response</button>
                        <button class="ide-tab" data-tab="network">Network</button>
                    </div>

                    <div class="ide-content" id="response-panel">
                        <div id="response-status" style="margin-bottom: 15px; display: none;">
                            <span id="status-code" style="font-weight: 600;"></span>
                            <span id="status-time" style="color: #666; margin-left: 10px;"></span>
                        </div>
                        <div class="json-viewer" id="response-viewer">
                            <span style="color: #666;">Execute a request to see the response...</span>
                        </div>
                    </div>

                    <div class="ide-content" id="network-panel" style="display: none; padding: 0;">
                        <div id="network-list" style="padding: 20px;">
                            <div style="color: #666; text-align: center;">No network activity yet</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // State
        let history = [];
        let networkLog = [];
        let isLoading = false;

        // DOM Elements
        const operationSelect = document.getElementById('operation');
        const tableNameInput = document.getElementById('table-name');
        const refreshTablesBtn = document.getElementById('refresh-tables-btn');
        const pkInput = document.getElementById('pk');
        const skInput = document.getElementById('sk');
        const keyGroup = document.getElementById('key-group');

        const valueTextarea = document.getElementById('value');
        const valueGroup = document.getElementById('value-group');
        const valueHint = document.getElementById('value-hint');
        const runBtn = document.getElementById('run-btn');
        const runText = document.getElementById('run-text');
        const snippetBtn = document.getElementById('snippet-btn');
        const responseViewer = document.getElementById('response-viewer');
        const responseStatus = document.getElementById('response-status');
        const statusCode = document.getElementById('status-code');
        const statusTime = document.getElementById('status-time');
        const historyList = document.getElementById('history-list');
        const networkList = document.getElementById('network-list');
        
        const condExprInput = document.getElementById('condition-expression');
        const updateExprInput = document.getElementById('update-expression');
        const exprNamesInput = document.getElementById('expr-names');
        const exprValuesInput = document.getElementById('expr-values');
        const updateGroup = document.getElementById('update-group');

        // State persistence
        function saveState() {
            localStorage.setItem('shvm-db-playground-state', JSON.stringify({
                op: operationSelect.value,
                table: tableNameInput.value,
                pk: pkInput.value,
                sk: skInput.value,
                val: valueTextarea.value,
                cond: condExprInput.value,
                upd: updateExprInput.value,
                en: exprNamesInput.value,
                ev: exprValuesInput.value
            }));
        }

        function loadState() {
            const stateJson = localStorage.getItem('shvm-db-playground-state');
            if (stateJson) {
                try {
                    const s = JSON.parse(stateJson);
                    if (s.op) operationSelect.value = s.op;
                    if (s.table) tableNameInput.value = s.table;
                    if (s.pk) pkInput.value = s.pk;
                    if (s.sk) skInput.value = s.sk;
                    if (s.val !== undefined) valueTextarea.value = s.val;
                    if (s.cond) condExprInput.value = s.cond;
                    if (s.upd) updateExprInput.value = s.upd;
                    if (s.en) exprNamesInput.value = s.en;
                    if (s.ev) exprValuesInput.value = s.ev;
                    operationSelect.dispatchEvent(new Event('change'));
                } catch(e) {}
            }
            const histJson = localStorage.getItem('shvm-db-playground-history');
            if (histJson) {
                try { history = JSON.parse(histJson); renderHistory(); } catch(e) {}
            }
        }

        document.querySelectorAll('input, select, textarea').forEach(el => {
            el.addEventListener('input', saveState);
            el.addEventListener('change', saveState);
        });

        // Tab switching
        document.querySelectorAll('.ide-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                const tabName = tab.dataset.tab;
                const isLeft = tab.closest('.ide-panel').classList.contains('left');

                // Update active tab
                tab.closest('.ide-tabs').querySelectorAll('.ide-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');

                // Show corresponding panel
                if (isLeft) {
                    document.getElementById('request-panel').style.display = tabName === 'request' ? 'block' : 'none';
                    document.getElementById('history-panel').style.display = tabName === 'history' ? 'block' : 'none';
                } else {
                    document.getElementById('response-panel').style.display = tabName === 'response' ? 'block' : 'none';
                    document.getElementById('network-panel').style.display = tabName === 'network' ? 'block' : 'none';
                }
            });
        });

        // Show/hide value field based on operation
        operationSelect.addEventListener('change', () => {
            const op = operationSelect.value;
            valueGroup.style.display = (op === 'PutItem' || op === 'CreateTable' || op === 'UpdateItem') ? 'block' : 'none';
            keyGroup.style.display = (op === 'PutItem' || op === 'GetItem' || op === 'DeleteItem' || op === 'UpdateItem') ? 'block' : 'none';
            updateGroup.style.display = (op === 'UpdateItem') ? 'block' : 'none';
            
            valueHint.textContent = '';
            
            if (op === 'CreateTable') {
                valueTextarea.value = JSON.stringify({
                    KeySchema: [
                        { AttributeName: "PK", KeyType: "HASH" },
                        { AttributeName: "SK", KeyType: "RANGE" }
                    ],
                    AttributeDefinitions: [
                        { AttributeName: "PK", AttributeType: "S" },
                        { AttributeName: "SK", AttributeType: "S" }
                    ],
                    ProvisionedThroughput: { ReadCapacityUnits: 5, WriteCapacityUnits: 5 }
                }, null, 2);
                valueTextarea.placeholder = "Table Definition JSON";
            } else if (op === 'PutItem') {
                if(valueTextarea.value.includes('KeySchema')) valueTextarea.value = "";
                valueTextarea.placeholder = '{\n  "name": "Alice",\n  "role": "admin"\n}';
                valueHint.textContent = '(Does not need PK/SK fields)';
            } else if (op === 'UpdateItem') {
                if(valueTextarea.value.includes('KeySchema')) valueTextarea.value = "";
                valueTextarea.placeholder = '{\n  "role": {"Action": "PUT", "Value": {"S": "admin"}}\n}';
                valueHint.textContent = '(AttributeUpdates JSON, or leave empty if using UpdateExpression)';
            }
        });

        refreshTablesBtn.addEventListener('click', async () => {
            await fetchTables();
        });

        async function fetchTables() {
            try {
                const response = await fetch('/api', {
                    method: 'POST',
                    headers: { 'x-amz-target': 'DynamoDB_20120810.ListTables' },
                    body: '{}'
                });
                const data = await response.json();
                if (data.TableNames) {
                    const list = document.getElementById('table-list');
                    list.innerHTML = data.TableNames.map(t => `<option value="${t}">`).join('');
                }
            } catch (e) {
                console.error("Failed to list tables", e);
            }
        }

        // Init
        fetchTables();
        loadState();
        operationSelect.dispatchEvent(new Event('change'));

        function buildPayload() {
            const operation = operationSelect.value;
            const tableName = tableNameInput.value.trim();
            const pk = pkInput.value.trim();
            const sk = skInput.value.trim();

            if (!tableName && operation !== 'ListTables') {
                return { error: 'Table Name is required' };
            }

            if ((operation === 'PutItem' || operation === 'GetItem' || operation === 'DeleteItem' || operation === 'UpdateItem') && (!pk)) {
                return { error: 'Partition Key is required' };
            }

            let payload = {};

            if (operation === 'ListTables') {
                payload = {};
            } else if (operation === 'CreateTable') {
                try {
                    const def = JSON.parse(valueTextarea.value);
                    payload = {
                        TableName: tableName,
                        ...def
                    };
                } catch (e) {
                    return { error: 'Invalid JSON for Table Definition' };
                }
            } else if (operation === 'DeleteTable') {
                payload = { TableName: tableName };
            } else if (operation === 'PutItem' || operation === 'GetItem' || operation === 'DeleteItem' || operation === 'UpdateItem') {
                payload = {
                    TableName: tableName,
                    Key: {
                        PK: { S: pk },
                    }
                };
                if (sk) payload.Key.SK = { S: sk };
            }

            if (operation === 'PutItem') {
                const valueStr = valueTextarea.value.trim();
                let valObj = {};

                if (valueStr) {
                    try {
                        valObj = JSON.parse(valueStr);
                    } catch (e) {
                        return { error: 'Invalid JSON in value field' };
                    }
                }

                payload.Item = {
                    PK: { S: pk },
                    ...wrapAttributes(valObj)
                };
                if (sk) payload.Item.SK = { S: sk };
                delete payload.Key;
            } else if (operation === 'UpdateItem') {
                const valueStr = valueTextarea.value.trim();
                if (valueStr) {
                    try {
                        payload.AttributeUpdates = JSON.parse(valueStr);
                    } catch (e) {
                        return { error: 'Invalid JSON in AttributeUpdates value field' };
                    }
                }
            }
            
            // Advanced parameters
            const cond = condExprInput.value.trim();
            const upd = updateExprInput.value.trim();
            const eanRaw = exprNamesInput.value.trim();
            const eavRaw = exprValuesInput.value.trim();
            
            if (cond) payload.ConditionExpression = cond;
            if (operation === 'UpdateItem' && upd) payload.UpdateExpression = upd;
            
            if (eanRaw) {
                try { payload.ExpressionAttributeNames = JSON.parse(eanRaw); } 
                catch (e) { return { error: 'Invalid JSON in ExpressionAttributeNames' }; }
            }
            if (eavRaw) {
                try { payload.ExpressionAttributeValues = JSON.parse(eavRaw); } 
                catch (e) { return { error: 'Invalid JSON in ExpressionAttributeValues' }; }
            }
            
            return { payload, operation };
        }

        snippetBtn.addEventListener('click', () => {
             const build = buildPayload();
             if (build.error) {
                 alert(build.error);
                 return;
             }
             
             const curlCmd = `curl -X POST https://db.shvm.in/api \\
  -H "Content-Type: application/json" \\
  -H "x-amz-target: DynamoDB_20120810.${build.operation}" \\
  -d '${JSON.stringify(build.payload)}'`;
             
             navigator.clipboard.writeText(curlCmd).then(() => {
                 const original = snippetBtn.innerHTML;
                 snippetBtn.innerHTML = '✅ Copied!';
                 setTimeout(() => snippetBtn.innerHTML = original, 2000);
             }).catch(() => alert('Failed to copy'));
        });

        // Execute request
        runBtn.addEventListener('click', async () => {
            if (isLoading) return;

            const build = buildPayload();
            if (build.error) {
                alert(build.error);
                return;
            }
            const { operation, payload } = build;

            setLoading(true);
            const startTime = Date.now();

            try {


                const response = await fetch('/api', {
                    method: 'POST',
                    headers: {
                        'x-amz-target': `DynamoDB_20120810.${operation}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                const duration = Date.now() - startTime;
                const data = await response.json();
                const requestId = response.headers.get('X-Request-Id');

                // Log network activity
                logNetwork({
                    method: 'POST',
                    url: '/api',
                    operation,
                    status: response.status,
                    duration,
                    request: payload,
                    response: data,
                    requestId: requestId || undefined
                });

                // Display response
                displayResponse(data, response.status, duration);

                // Add to history
                if (response.status >= 200 && response.status < 300) {
                    if (operation === 'CreateTable' || operation === 'DeleteTable') {
                        fetchTables();
                    }
                }

                addToHistory({
                    operation,
                    pk: pkInput.value.trim() || '-',
                    sk: skInput.value.trim() || '-',
                    timestamp: new Date().toISOString(),
                    status: response.status
                });


            } catch (error) {
                const duration = Date.now() - startTime;
                displayResponse({ error: error.message }, 0, duration);

                logNetwork({
                    method: 'POST',
                    url: '/api',
                    operation,
                    status: 0,
                    duration,
                    error: error.message
                });
            } finally {
                setLoading(false);
            }
        });

        function setLoading(loading) {
            isLoading = loading;
            runBtn.disabled = loading;
            runText.textContent = loading ? '⏳ Loading...' : '▶ Execute';
        }

        function displayResponse(data, status, duration) {
            responseStatus.style.display = 'block';

            const statusClass = status >= 200 && status < 300 ? 'success' : 'error';
            statusCode.textContent = status ? `${status} ${getStatusText(status)}` : 'Network Error';
            statusCode.style.color = statusClass === 'success' ? '#4ade80' : '#f87171';
            statusTime.textContent = `${duration}ms`;

            responseViewer.textContent = JSON.stringify(data, null, 2);
            responseViewer.style.color = statusClass === 'success' ? '#a5d6ff' : '#f87171';
        }

        function getStatusText(status) {
            const texts = {
                200: 'OK',
                400: 'Bad Request',
                404: 'Not Found',
                501: 'Not Implemented',
                500: 'Internal Server Error'
            };
            return texts[status] || '';
        }

        function wrapAttributes(obj) {
            const wrapped = {};
            for (const key in obj) {
                const val = obj[key];
                if (typeof val === 'string') wrapped[key] = { S: val };
                else if (typeof val === 'number') wrapped[key] = { N: val.toString() };
                else if (typeof val === 'boolean') wrapped[key] = { BOOL: val };
                else if (val === null) wrapped[key] = { NULL: true };
                else if (Array.isArray(val)) {
                    wrapped[key] = {
                        L: val.map(v => {
                            if (typeof v === 'object' && v !== null) return { M: wrapAttributes(v) };
                            return wrapAttributes({ v }).v;
                        })
                    };
                }
                else if (typeof val === 'object') wrapped[key] = { M: wrapAttributes(val) };
            }
            return wrapped;
        }

        function addToHistory(entry) {
            history.unshift(entry);
            if (history.length > 50) history.pop(); // Keep last 50
            localStorage.setItem('shvm-db-playground-history', JSON.stringify(history));
            renderHistory();
        }

        function renderHistory() {
            if (history.length === 0) {
                historyList.innerHTML = '<li style="padding: 20px; text-align: center; color: #666;">No history yet</li>';
                return;
            }

            historyList.innerHTML = history.map((entry, idx) => `
                <li class="history-item" onclick="loadFromHistory(${idx})">
                    <div class="history-op">${entry.operation}</div>
                    <div class="history-key">PK: ${entry.pk} | SK: ${entry.sk}</div>
                    <div style="font-size: 0.75rem; color: #555; margin-top: 4px;">
                        ${new Date(entry.timestamp).toLocaleTimeString()} 
                        <span style="color: ${entry.status >= 200 && entry.status < 300 ? '#4ade80' : '#f87171'}">
                            ${entry.status}
                        </span>
                    </div>
                </li>
            `).join('');
        }

        function loadFromHistory(idx) {
            const entry = history[idx];
            operationSelect.value = entry.operation;
            pkInput.value = entry.pk;
            skInput.value = entry.sk;

            // Switch to request tab
            document.querySelector('.ide-panel.left .ide-tab[data-tab="request"]').click();
        }

        function logNetwork(entry) {
            networkLog.unshift(entry);
            if (networkLog.length > 100) networkLog.pop();
            renderNetwork();
        }

        function renderNetwork() {
            if (networkLog.length === 0) {
                networkList.innerHTML = '<div style="color: #666; text-align: center; padding: 20px;">No network activity yet</div>';
                return;
            }

            networkList.innerHTML = networkLog.map((entry, idx) => `
                <div class="network-entry" onclick="toggleNetworkDetails(${idx})">
                    <div class="network-meta">
                        <span class="network-method">${entry.method}</span>
                        <span style="color: ${entry.status >= 200 && entry.status < 300 ? '#4ade80' : '#f87171'}">
                            ${entry.status || 'ERR'}
                        </span>
                        <span style="color: #666;">${entry.duration}ms</span>
                        ${entry.requestId ? `<a href="/trace.html?requestId=${encodeURIComponent(entry.requestId)}" target="_blank" rel="noopener" class="network-trace-link" onclick="event.stopPropagation()">View trace</a>` : ''}
                    </div>
                    <div class="network-url">${entry.operation} → ${entry.url}</div>
                    <div class="network-details" id="network-details-${idx}">
                        <div style="margin-bottom: 10px;">
                            <strong style="color: #888;">Request:</strong>
                            <pre style="margin-top: 5px; font-size: 0.8rem; color: #aaa;">${JSON.stringify(entry.request || {}, null, 2)}</pre>
                        </div>
                        <div>
                            <strong style="color: #888;">Response:</strong>
                            <pre style="margin-top: 5px; font-size: 0.8rem; color: #aaa;">${JSON.stringify(entry.response || entry.error || {}, null, 2)}</pre>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function toggleNetworkDetails(idx) {
            const entry = document.querySelector(`#network-details-${idx}`);
            const parent = entry.closest('.network-entry');
            parent.classList.toggle('open');
        }
    </script>
    <script src="script.js"></script>
</body>

</html>
